apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-database
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.user .Values.postgres.password .Release.Name .Values.postgres.database | quote }}
{{- $storageCredentials := .Values.storage.credentials | default dict }}
{{- $serviceAccount := .Values.serviceAccount | default dict }}
{{- $serviceAccountName := ($serviceAccount.name | default (printf "%s-api" .Release.Name)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth
type: Opaque
stringData:
  JWT_SIGNING_SECRET: {{ .Values.auth.jwtSigningSecret | quote }}
  DEVICE_TOKEN_ENCRYPTION_KEY: {{ .Values.auth.deviceTokenEncryptionKey | default "" | quote }}
  OPENIM_API_TOKEN: {{ .Values.auth.openIMAPIToken | quote }}
{{- if and (eq ($storageCredentials.mode | default "static") "static") (not ($storageCredentials.existingSecret | default "")) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-storage
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ ($storageCredentials.accessKeyID | default "") | quote }}
  AWS_SECRET_ACCESS_KEY: {{ ($storageCredentials.secretAccessKey | default "") | quote }}
{{- end }}
---
{{- if ($serviceAccount.create | default false) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  {{- with ($serviceAccount.annotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ .Release.Name }}-postgres}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}-postgres}}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{containerPort: 5432}]
          envFrom: [{secretRef: {name: {{ .Release.Name }}-database}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  selector: {app: {{ .Release.Name }}-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector: {matchLabels: {app: {{ .Release.Name }}-api}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}-api}}
    spec:
      serviceAccountName: {{ if ($serviceAccount.name | default "") }}{{ $serviceAccount.name }}{{ else if ($serviceAccount.create | default false) }}{{ printf "%s-api" .Release.Name }}{{ else }}default{{ end }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/pingmessenger-db", "-mode=migrate", "-wait=2m"]
          envFrom: [{secretRef: {name: {{ .Release.Name }}-database}}]
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 8080}, {containerPort: 9090, name: webhook-grpc}]
          env:
            - {name: HTTP_ADDR, value: ":8080"}
            - {name: APP_ENV, value: development}
            - {name: OPENIM_API_BASE_URL, value: {{ .Values.auth.openIMAPIBaseURL | quote }}}
            - {name: OPENIM_CONVERSATION_GRPC_TARGET, value: {{ .Values.auth.openIMConversationGRPCTarget | quote }}}
            - {name: PINGPAY_EVENT_SECRET, value: {{ .Values.auth.pingpayEventSecret | default "" | quote }}}
            - {name: SOLANA_RPC_URL, value: {{ .Values.chain.solanaRPCURL | default "" | quote }}}
            - {name: SOLANA_RPC_TIMEOUT, value: {{ .Values.chain.solanaRPCTimeout | default "10s" | quote }}}
            - {name: EMAIL_PROVIDER, value: {{ .Values.email.provider | quote }}}
            - {name: SMTP_ADDRESS, value: {{ .Values.email.smtpAddress | quote }}}
            - {name: SMTP_FROM, value: {{ .Values.email.smtpFrom | quote }}}
            - {name: AWS_REGION, value: {{ .Values.email.awsRegion | quote }}}
            - {name: AWS_SNS_TOPIC_ARN, value: {{ .Values.email.awsSNSTopicARN | quote }}}
            - {name: AWS_SES_FROM_EMAIL, value: {{ .Values.email.awsSESFromEmail | quote }}}
            - {name: EMAIL_MIRROR_SMTP_ADDRESS, value: {{ .Values.email.mirrorSMTPAddress | quote }}}
            - {name: EMAIL_MIRROR_FROM, value: {{ .Values.email.mirrorFrom | quote }}}
            - {name: SMS_MIRROR_TOPIC_ARN, value: {{ .Values.email.smsMirrorTopicARN | quote }}}
            - {name: S3_BUCKET, value: {{ .Values.storage.bucket | quote }}}
            - {name: S3_ENDPOINT, value: {{ .Values.storage.endpoint | quote }}}
            - {name: S3_PUBLIC_BASE_URL, value: {{ .Values.storage.publicBaseURL | quote }} }
          envFrom:
            - secretRef: {name: {{ .Release.Name }}-database}
            - secretRef: {name: {{ .Release.Name }}-auth}
            {{- if ($storageCredentials.existingSecret | default "") }}
            - secretRef: {name: {{ $storageCredentials.existingSecret }}}
            {{- else if eq ($storageCredentials.mode | default "static") "static" }}
            - secretRef: {name: {{ .Release.Name }}-storage}
            {{- end }}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: {app: {{ .Release.Name }}-api}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: 8080}, {name: webhook-grpc, port: 9090, targetPort: webhook-grpc}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mailpit
spec:
  replicas: 1
  selector: {matchLabels: {app: {{ .Release.Name }}-mailpit}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}-mailpit}}
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27
          ports: [{containerPort: 1025}, {containerPort: 8025}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mailpit
spec:
  selector: {app: {{ .Release.Name }}-mailpit}
  ports:
    - {name: smtp, port: 1025, targetPort: 1025}
    - {name: web, port: 8025, targetPort: 8025}
