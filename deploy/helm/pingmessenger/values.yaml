image:
  repository: localhost:32000/pingmessenger-platform
  tag: dev
  pullPolicy: Always
postgres:
  image: postgres:17-alpine
  database: pingmessenger
  user: pingmessenger
  password: pingmessenger-local-only
auth:
  jwtSigningSecret: development-only-change-before-any-shared-deployment-1234
  # Base64url-encoded 32-byte key. Replace for every deployment.
  deviceTokenEncryptionKey: replace-with-a-base64url-encoded-32-byte-key
  # HMAC secret used by the PingPay-user status-event ingress. Keep empty when
  # the external watcher is not enabled; inject it through private values.
  pingpayEventSecret: ""
  # Existing local MicroK8s OpenIM Platform API service (namespace-qualified).
  openIMAPIBaseURL: http://openimserver-openim-api.openim.svc.cluster.local
  openIMConversationGRPCTarget: openimserver-openim-rpc-conversation.openim.svc.cluster.local:10220
  openIMAPIToken: ""
email:
  provider: smtp
  smtpAddress: pingmessenger-mailpit:1025
  smtpFrom: no-reply@pingmessenger.local
  awsRegion: ap-south-1
  awsSNSTopicARN: ""
  awsSESFromEmail: no-reply@meainternal.com
  mirrorSMTPAddress: ""
  mirrorFrom: e2e-mirror@pingmessenger.local
  smsMirrorTopicARN: ""
storage:
  # "minio" is for local MicroK8s. For AWS S3 set provider: aws and endpoint: "".
  provider: minio
  bucket: openim
  documentBucket: pingmessenger-message-documents
  endpoint: http://im-minio.openim.svc.cluster.local:9000
  publicBaseURL: http://im-minio.openim.svc.cluster.local:9000/openim
  credentials:
    # static creates a chart-owned Secret unless existingSecret is set. Use
    # irsa on EKS (or another workload-identity provider) to use the AWS SDK
    # default credential chain without injecting access keys.
    mode: static
    existingSecret: ""
    accessKeyID: root
    secretAccessKey: openIM123
serviceAccount:
  create: true
  name: ""
  annotations: {}
service:
  port: 8080
documentPolicy:
  maxBytes: 104857600
  maxCount: 20
  maxBytes24h: 1073741824
  retention: 168h
  allowedMIMEs: application/pdf,application/rtf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/plain,text/csv,application/zip
chain:
  # Set a private/provider RPC URL in shared deployments. Empty disables
  # asynchronous chain observation while payment intents remain available.
  solanaRPCURL: ""
  solanaRPCTimeout: 10s
