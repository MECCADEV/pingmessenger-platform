image:
  repository: localhost:32000/pingmessenger-platform
  tag: dev
  pullPolicy: Always
postgres:
  image: postgres:17-alpine
  database: pingmessenger
  user: pingmessenger
  password: pingmessenger-local-only
auth:
  jwtSigningSecret: development-only-change-before-any-shared-deployment-1234
  # Existing local MicroK8s OpenIM Platform API service (namespace-qualified).
  openIMAPIBaseURL: http://openimserver-openim-api.openim.svc.cluster.local
  openIMAPIToken: ""
email:
  provider: smtp
  smtpAddress: pingmessenger-mailpit:1025
  smtpFrom: no-reply@pingmessenger.local
  awsRegion: ap-south-1
  awsSNSTopicARN: ""
storage:
  # "minio" is for local MicroK8s. For AWS S3 set provider: aws and endpoint: "".
  provider: minio
  bucket: openim
  endpoint: http://im-minio.openim.svc.cluster.local:9000
  publicBaseURL: http://im-minio.openim.svc.cluster.local:9000/openim
  credentials:
    # static creates a chart-owned Secret unless existingSecret is set. Use
    # irsa on EKS (or another workload-identity provider) to use the AWS SDK
    # default credential chain without injecting access keys.
    mode: static
    existingSecret: ""
    accessKeyID: root
    secretAccessKey: openIM123
serviceAccount:
  create: true
  name: ""
  annotations: {}
service:
  port: 8080
